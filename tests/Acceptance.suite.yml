actor: AcceptanceTester
suite_namespace: Tests\Acceptance
modules:
    enabled:
          - WebDriver:
              url: 'https://stellantis.autocrm.ru/'
              browser: chrome
              host: tests_selenium
              port: 4444
              window_size: 1920x1080
              capabilities:
                  goog:chromeOptions:
                      args:
                          - '--headless=new'
                          - '--no-sandbox'
                          - '--disable-dev-shm-usage'