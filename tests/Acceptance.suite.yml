actor: AcceptanceTester
suite_namespace: Tests\Acceptance

modules:
    enabled:
        - WebDriver:
              url: 'https://stellantis.autocrm.ru/'
              browser: chrome
              port: 4444
              window_size: 1920x1080
              capabilities:
                  goog:chromeOptions:
                      args:
                          - '--headless=new'
                          - '--no-sandbox'
                          - '--disable-dev-shm-usage'
                          - '--user-agent=Mozilla/5.0 (Macintosh; Intel Mac OS X 13_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36'