actor: AcceptanceTester
suite_namespace: Tests\Acceptance

modules:
    enabled:
        - WebDriver:
              url: 'https://stellantis.autocrm.ru/'
              browser: chrome
              port: 4444
              window_size: 1920x1080
              capabilities:
                  goog:chromeOptions:
                      args:
                          - '--no-sandbox'
                          - '--disable-dev-shm-usage'
                          - '--force-device-scale-factor=1'
        - VisualCeption:
            maximumDeviation: 5
            saveCurrentImageIfFailure: true
            fullScreenShot: false