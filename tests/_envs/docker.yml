modules:
  config:
    WebDriver:
      host: selenium
      capabilities:
        goog:chromeOptions:
          args:

            - '--no-sandbox'
            - '--disable-dev-shm-usage'
            - '--user-agent=Mozilla/5.0 (Macintosh; Intel Mac OS X 13_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36'